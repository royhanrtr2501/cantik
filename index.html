<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Hi Sayang 💛</title>
  <style>
    :root { --bg: #0b0f17; --card: #111827; --txt: #e5e7eb; --muted:#9ca3af; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial;
      background: radial-gradient(1200px 800px at 50% 20%, #1f2a44, var(--bg));
      color: var(--txt); min-height: 100vh; display: grid; place-items: center;
      padding: 24px;
    }
    .btn {
      border: 0; padding: 14px 18px; border-radius: 14px; font-weight: 700;
      background: #fbbf24; color: #111827; cursor: pointer; width: 100%;
    }
    .btn.secondary { background: #1f2937; color: var(--txt); font-weight: 600; }
    .card {
      width: min(420px, 100%); background: rgba(17,24,39,.72);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
      border-radius: 20px; padding: 18px;
    }
    .title { font-size: 22px; margin: 0 0 6px; }
    .desc { margin: 0 0 14px; color: var(--muted); line-height: 1.4; }

    /* Modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: center; justify-content: center;
      padding: 18px;
    }
    .overlay.show { display: flex; }
    .modal {
      width: min(440px, 100%);
      background: rgba(17,24,39,.9);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 22px; padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      transform: translateY(10px); opacity: 0;
      transition: .18s ease;
    }
    .overlay.show .modal { transform: translateY(0); opacity: 1; }
    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    .small { font-size: 12px; color: var(--muted); margin-top: 10px; text-align:center; }
    .kiss { font-size: 34px; }
    a { color: #93c5fd; }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">Hai Cantik💛</h1>
    <p class="desc">HEHE Coba aja ya. Klik tombol di bawah ya.</p>
    <button class="btn" id="open">Buka pesan rahasia ✨</button>
    <p class="small">kalau popup nggak muncul, Kayaknya safari auto blok, can see the setting ya.</p>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="kiss">💌</div>
      <h2 id="mTitle" class="title" style="margin-top:6px;">Aku kangen.</h2>
      <p class="desc" id="msg">
        Kamu selalu jadi alasan aku semangat setiap hari, ya?
      </p>

      <div class="row">
        <button class="btn" id="yes">Iya 😳</button>
        <button class="btn secondary" id="no">Enggak 🙄</button>
      </div>

      <p class="small">
        (Kamu bisa tap di luar kotak buat nutup)
      </p>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('overlay');
    const openBtn = document.getElementById('open');
    const yesBtn = document.getElementById('yes');
    const noBtn  = document.getElementById('no');
    const msg    = document.getElementById('msg');

    function openModal() {
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    }
    function closeModal() {
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
    }

    openBtn.addEventListener('click', () => {
      // Safari-friendly: popup/modal only after user interaction
      openModal();
      // Optional: little vibration on mobile (won't error if unsupported)
      if (navigator.vibrate) navigator.vibrate(20);
    });

    yesBtn.addEventListener('click', () => {
      msg.textContent = "Oke. Berarti ayaaangg kangen aku juga kaannn. 😌";
      yesBtn.textContent = "Peluk dulu 🤍";
      noBtn.textContent = "Aku bercanda";
    });

    noBtn.addEventListener('click', () => {
      // “No” button kabur-kaburan (fun)
      const phrases = [
        "Yakin? 🥺",
        "Coba pikir lagi…",
        "Aku sedih loh 😔",
        "Oke… tapi aku tetep semangat kok walaupun cuma liat kamu aja. hehe",
        "Klik yang Iya aja ya 😳"
      ];
      msg.textContent = phrases[Math.floor(Math.random()*phrases.length)];
      // swap positions a bit
      noBtn.style.transform = `translate(${Math.random()*16-8}px, ${Math.random()*12-6}px)`;
    });

    // Close when tapping outside model
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });

    // Close on Escape (desktop)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>

</body>
</html>
